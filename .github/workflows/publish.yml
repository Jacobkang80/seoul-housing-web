name: Publish Seoul Housing
on:
  push:
    branches: [main]
    paths: ['web/**', 'lib/**', 'scripts/**', 'tests/**', 'tests.mjs', 'package.json', '.github/workflows/**', 'data/snapshot.json']
  schedule:
    - cron: '15 3,9,22 * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: Refresh official public data before publishing
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: seoul-housing-web-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: github.event_name == 'schedule' || inputs.collect == true
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - if: github.event_name == 'schedule' || inputs.collect == true
        uses: actions/cache@v4
        with:
          path: data/transactions84
          key: housing-web-v1-${{ github.run_id }}
          restore-keys: housing-web-v1-
      - name: Refresh public sources
        if: github.event_name == 'schedule' || inputs.collect == true
        id: collect
        continue-on-error: true
        run: node scripts/collect.mjs
      - run: node --test tests.mjs
      - run: python tests/test_aggregate84.py
      - run: node scripts/export-static.mjs
      - name: Save published data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json public
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public web dashboard'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Report source status
        if: steps.collect.outcome == 'failure'
        run: echo 'Some sources failed. Last valid data is preserved; see the dashboard update time.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish HTTPS dashboard
        id: deployment
        uses: actions/deploy-pages@v4
